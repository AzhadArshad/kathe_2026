# Submission 026 — union restorer, model suppressed to the MIDDLE of the
# interval. bias 1.6836 -> 3.25.
#
# Sibling of 025. Same decode (R12-selected), same union (r11b_dense + lexicon,
# merge `known`), same single knob. See submissions/025/postproc.yaml for the
# full argument; the short version:
#
#   bias +1.6836 -> 15.05 (sub 024, best)   ... 0 of 719 tail rows changed
#   bias +2.25   -> THIS's sibling (025)    ... 185 of 719 changed (26%)
#   bias +3.25   -> THIS                    ... ~400 of 719 changed (56%)
#   bias +inf    -> 13.52 (sub 011)         ... 719 of 719 changed (100%)
#
# A maximum exists strictly inside (+1.6836, +inf), because both endpoints are
# measured and the interior point 024 beats the +inf endpoint by 1.53. These two
# probes bisect it.
#
# WHY THIS ONE IS FURTHER OUT. 025 is placed near sub 024 on the argument that
# the peak is close. That argument could be wrong: the leaderboard has already
# reversed an R0-derived intuition once this week (sub 019 beat sub 015 by
# emitting MORE marks, against a density anchor everyone believed). If the peak
# is actually mid-interval, 025 alone would miss it and report a false "024 is
# the top". This probe is the insurance against that reading.
#
# HOW TO READ THE PAIR — decided in advance, so the result is not fitted after
# the fact:
#
#   both < 15.05          -> sub 024 is the peak. Route finished. Freeze on 024.
#   025 > 15.05 > 026     -> peak is in (1.6836, 3.25), near 025. Route finished
#                            anyway; no slots left before the deadline.
#   026 > 025             -> the peak is mid-interval and the "peak is close"
#                            prior was wrong. Still freeze on the best measured
#                            score — there is no time for a third probe.
#
# In every branch the action after these two is the same: select the best three
# measured submissions and freeze. This is the last experiment of the project.
scorer_normalizer: true
unicode_form: null
map_punctuation: false
strip_zwj: false
collapse_whitespace: false
diacritic_lexicon: data/processed/diacritic_lexicon_both.json
restore_model: models/restore/r11b_dense.pt
restore_none_bias: 3.25
restore_merge: known
