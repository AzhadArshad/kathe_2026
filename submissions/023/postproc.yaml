# Union of r11b_dense + lexicon (sub 021 = 14.82) with the MODEL let off the
# leash on the tail. In merge `known` the lexicon overrides every word it has an
# entry for, so a negative bias adds model marks ONLY on words the lexicon does
# not know. That is a different lever from sub 020, where the model was marking
# more freely everywhere including over lexicon-known words — 020 scored 13.79.
#
# 021 proved density is not the driver: 020 sat at 12.50 and scored 13.79 while
# 021 sat at 12.36 and scored 14.82. Placement decides. This tests whether the
# TAIL — words neither restorer is confident about — still has recall to give.
#
# This is the more aggressive of the pair: density 13.78, 43.7% of rows changed
# from 021. If 022 gains and this loses, the tail optimum is between them.
scorer_normalizer: true
unicode_form: null
map_punctuation: false
strip_zwj: false
collapse_whitespace: false
diacritic_lexicon: data/processed/diacritic_lexicon_both.json
restore_model: models/restore/r11b_dense.pt
restore_none_bias: -1.5
restore_merge: known
