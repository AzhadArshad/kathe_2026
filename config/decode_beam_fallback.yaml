# Live-round FALLBACK decode: plain beam search, no MBR.
#
# This is the configuration to run if MBR is too slow on the organizers' machine
# on 2026-08-21. Fifteen-plus teams get verified in one session, so a decode
# that is correct but slow is a real risk to the round even though no runtime
# limit was stated (PLANNING.md Q4, §Risk register).
#
# It reproduces submission 007 EXACTLY — same checkpoint, same beam, same
# post-processing. The only thing given up is the MBR selection stage, so the
# fallback is not a degraded guess: it is the system that scored 11.81.
#
#   python scripts/translate.py \
#       --input  data/raw/englishdev.csv \
#       --output out/hyp.beam.txt \
#       --model  models/r3-200m-full \
#       --beam 5 --batch-size 16 --length-penalty 1.0
#
#   python scripts/make_submission.py \
#       --source     data/raw/englishdev.csv \
#       --hypotheses out/hyp.beam.txt \
#       --postproc   config/postproc_r3_both.yaml \
#       --output     out/submission.csv
#
# Cost comparison, measured — fill both rows from the R5 run before the live
# round and keep them here, because the decision on the day is made from these
# two numbers and nothing else:
#
#   beam 5          : __ s/sentence   (1,730 sentences -> __ min)
#   MBR 32 epsilon  : __ s/sentence   (1,730 sentences -> __ min)
#
# Switching rule for the day: if the MBR estimate exceeds the time the
# organizers give, run this file's command instead. It needs no extra flags and
# no pool files, so it cannot fail for a reason MBR would not also hit.

model: models/r3-200m-full
decode: beam
num_beams: 5
length_penalty: 1.0
max_new_tokens: 256
batch_size: 16
postproc: config/postproc_r3_both.yaml
