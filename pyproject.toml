# This file defines the DATA + SCORING environment only (`.venv`, via `uv sync`):
# BPCC extraction, filtering, LaBSE, corpus and dev-set building, and metric
# replication. It deliberately does NOT include IndicTransToolkit.
#
# IndicTrans2 DECODING lives in a second environment, `requirements-decode.txt`
# -> `.venv-decode`. That split is forced, not stylistic: IndicTransToolkit
# requires transformers==4.46.1, which caps huggingface-hub<1.0, while
# datasets>=5.0.1 here requires huggingface-hub>=1.26.1. The two cannot coexist
# in one interpreter — `uv lock` reports the conflict as unsatisfiable.
# See requirements-decode.txt for the full reasoning and the hardware warning.

[project]
name = "kathe-2026"
version = "0.1.0"
description = "English to Kashmiri machine translation for KATHE 2026"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Azhad Arshad" }]
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "huggingface-hub>=1.26.1",
    "kashmirinormalizer==0.1.0",
    "pandas>=3.0.5",
    "peft>=0.20.0",
    "regex>=2026.7.19",
    "sacrebleu>=2.6.0",
    "sentence-transformers>=5.7.0",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

# Makes the project's own code importable from the venv, so `import config` and
# `import data.filter` work without a PYTHONPATH=src prefix on every command.
# Nothing is published anywhere; this is a local editable install.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Strip the src/ prefix so src/config.py -> config, src/data/ -> data, etc.,
# matching the layout PROJECT_NOTES.md §4 specifies.
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
